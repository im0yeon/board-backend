# yaml-language-server: $schema=https://www.coderabbit.ai/integrations/schema.v2.json

language: "ko-KR"

tone_instructions: "간결하고 사실 중심으로 작성한다. 칭찬과 사족은 생략하고 문제와 근거만 짚는다."

reviews:
  auto_review:
    enabled: true
    base_branches:
      - "dev"
      - "main"
  path_filters:
    - "!gradle/wrapper/**"
  path_instructions:
    - path: "src/main/java/**/*.java"
      instructions: |
        영속성 계층은 쓰기·단건조회를 JPA, 목록·검색·통계를 MyBatis로 나눠 호출하는 병행 구조다.
        JPA 쓰기 결과에 의존해 MyBatis로 조회하는데 그 사이 flush가 보장되지 않으면 지적한다.
        saveAndFlush나 명시적 flush 호출, IDENTITY 전략 INSERT로 반영이 이미 보장된 경로는 지적하지 않는다.
        서비스 계층에 JPA·MyBatis 타입이 노출되면 지적한다. 페이징은 자체 PageCommand·PageResponse를 쓴다.
        컨트롤러가 엔티티를 그대로 반환하면 지적한다.
        주석은 생략이 기본이다. AI 생성 표시, 변경 이력, 자명한 설명은 제거를 제안한다.
        로그 메시지는 한국어로 쓰고 변수값에 맥락을 붙인다.
    - path: "src/main/resources/data/flyway/**"
      instructions: |
        스키마 소유자는 Flyway다. 이미 반영된 마이그레이션 파일을 수정하면 중대한 문제로 보고한다.
        Y/N 플래그 컬럼은 CHAR(1)이어야 한다. VARCHAR(1)이면 스키마 검증이 실패해 부팅이 깨진다.
    - path: "src/test/**"
      instructions: |
        테스트가 프로덕션 규칙을 의도적으로 위반하는 부분은 지적하지 않는다.
