<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('게시글 등록 | Board Admin')}"></head>
<body>
<div class="app">
  <header th:replace="~{fragments/layout :: header('')}"></header>

  <div class="app-body">

    <main class="app-main">
      <div class="page-head page-head--stacked">
        <nav class="breadcrumb"><span>홈</span><span>콘텐츠 관리</span><span>게시판 관리</span><span id="crumb-mode">등록</span></nav>
        <h1 class="page-head__title" id="page-title">게시글 등록</h1>
      </div>

      <form class="content-card" id="board-form" novalidate>
        <div class="content-card__scroll content-card__scroll--fill">
          <div class="def-list def-list--fill">
            <div class="def-row">
              <div class="def-row__label">제목 <span class="req">*</span></div>
              <div class="def-row__value">
                <input class="input" id="f-title" type="text" maxlength="100" placeholder="제목을 입력하세요 (최대 100자)" required>
              </div>
            </div>

            <div class="def-row def-row--split">
              <div class="def-row__label">작성자 <span class="req">*</span></div>
              <div class="def-row__value">
                <input class="input" id="f-author" type="text" maxlength="20" placeholder="작성자명" required>
              </div>
              <div class="def-row__label">등록일</div>
              <div class="def-row__value">
                <input class="input" id="f-date" type="date" value="2026-08-31">
              </div>
            </div>


            <div class="def-row">
              <div class="def-row__label">공지 설정</div>
              <div class="def-row__value">
                <div class="radio-group">
                  <label class="radio-label">
                    <input type="radio" class="radio" name="notice" value="normal" checked>
                    <span>일반</span>
                  </label>
                  <label class="radio-label">
                    <input type="radio" class="radio" name="notice" value="notice">
                    <span>공지</span>
                  </label>
                </div>
                <span class="field__help" style="margin-left:var(--spacing-lg)">공지로 설정하면 목록 상단에 <span class="badge badge--notice">공지</span> 뱃지와 함께 노출됩니다.</span>
              </div>
            </div>
            <div class="def-row def-row--content">
              <div class="def-row__label">내용 <span class="req">*</span></div>
              <div class="def-row__value def-row__value--block">
                <textarea class="textarea" id="f-content" placeholder="내용을 입력하세요" required></textarea>
                <p class="field__help" style="margin-top:8px"><span id="char-count">0</span> / 4000자</p>
              </div>
            </div>

            <div class="def-row">
              <div class="def-row__label">첨부파일</div>
              <div class="def-row__value">
                <input type="file" id="f-file" style="font-size:var(--font-size-sm)">
              </div>
            </div>
          </div>
        </div>

        <div class="content-card__footer">
          <button type="button" class="btn btn--secondary" onclick="location.href='list.html'">목록</button>
          <div class="spacer"></div>
          <button type="button" class="btn btn--secondary" id="btn-cancel">취소</button>
          <button type="submit" class="btn btn--primary" id="btn-save">저장</button>
        </div>
      </form>
    </main>
  </div>
</div>

<script th:src="@{/assets/js/alert.js}"></script>
<script>
(function () {
  var params = new URLSearchParams(location.search);
  var isEdit = params.get('mode') === 'edit';

  /* ---------- 등록 / 수정 모드 전환 ---------- */
  if (isEdit) {
    document.title = '게시글 수정 | Board Admin';
    document.getElementById('page-title').textContent = '게시글 수정';
    document.getElementById('crumb-mode').textContent = '수정';
    document.getElementById('btn-save').textContent = '수정';
    document.getElementById('f-title').value  = '2026년 하반기 시스템 정기 점검 안내';
    document.getElementById('f-author').value = '관리자';
    document.getElementById('f-date').value   = '2026-08-28';
    document.querySelector('input[name="notice"][value="notice"]').checked = true;
    document.getElementById('f-content').value =
      '안녕하세요, 시스템 운영팀입니다.\n\n서비스 안정화를 위한 하반기 정기 점검을 아래와 같이 진행합니다.\n점검 시간 동안 일부 서비스 이용이 제한되오니 업무에 참고 부탁드립니다.\n\n■ 점검 일시\n2026년 9월 6일(토) 02:00 ~ 06:00 (4시간)';
  }

  /* ---------- 글자 수 ---------- */
  var content = document.getElementById('f-content');
  var counter = document.getElementById('char-count');
  function updateCount() { counter.textContent = content.value.length; }
  content.addEventListener('input', updateCount);
  updateCount();

  /* ---------- 저장 / 수정: 확인 → 완료 / 실패 ---------- */
  document.getElementById('board-form').addEventListener('submit', function (e) {
    e.preventDefault();

    var title = document.getElementById('f-title').value.trim();
    var author = document.getElementById('f-author').value.trim();
    if (!title || !author || !content.value.trim()) {
      Alert.open({
        type: 'error',
        title: '필수 항목을 입력해 주세요.',
        message: '제목, 작성자, 내용은 필수 입력 항목입니다.'
      });
      return;
    }

    var key = isEdit ? 'edit' : 'save';
    Alert.preset(key + '.confirm', {
      onConfirm: function () {
        var ok = true; // 실제 구현에서는 API 응답으로 분기
        if (ok) {
          Alert.preset(key + '.success', {
            onConfirm: function () { location.href = isEdit ? 'detail.html' : 'list.html'; }
          });
        } else {
          Alert.preset(key + '.fail');
        }
      }
    });
  });

  /* ---------- 취소 ---------- */
  document.getElementById('btn-cancel').addEventListener('click', function () {
    Alert.open({
      type: 'confirm',
      title: '작성을 취소하시겠습니까?',
      message: '입력한 내용은 저장되지 않습니다.',
      confirmText: '나가기',
      cancelText: '계속 작성',
      onConfirm: function () { location.href = isEdit ? 'detail.html' : 'list.html'; }
    });
  });
})();
</script>
</body>
</html>
