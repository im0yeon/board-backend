spring:
  datasource:
    url: jdbc:h2:mem:localdb;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console

logging:
  level:
    com.example.myapp.mapper: trace   # 매퍼 패키지 지정 — SQL과 바인딩 파라미터가 찍힘
    org.flywaydb: debug