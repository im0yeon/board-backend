# ==================== 공통 ====================
server:
  port: 28188

spring:
  application:
    name: board
  profiles:
    default: local
  servlet:
    multipart:
      max-file-size: 12MB
      max-request-size: 15MB
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:data/flyway
    validate-on-migrate: true

# 프로젝트 루트 기준 상대 경로
file:
  base-dir: files

mybatis:
  type-aliases-package: com.imooyoni.board.data.domain
  mapper-locations: classpath:data/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    local-cache-scope: STATEMENT
    jdbc-type-for-null: NULL
    default-fetch-size: 100
    default-statement-timeout: 30

decorator:
  datasource:
    enabled: false   # 기본: P6Spy 완전 비활성화 (DataSource를 감싸지 않음)
    p6spy:
      logging: slf4j
      multiline: false
      log-format: "%(executionTime)ms | %(category) | %(sql)"

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true
  default-produces-media-type: application/json

# ==================== local ====================
---
spring:
  config:
    activate:
      on-profile: local
  flyway:
    locations: classpath:data/flyway,classpath:data/seed/local
  datasource:
    url: jdbc:h2:mem:localdb;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  thymeleaf:
    cache: false

decorator:
  datasource:
    enabled: true    # local에서만 SQL 로그 활성화
    p6spy:
      enable-logging: true

logging:
  level:
    com.imooyoni.board.data.mapper: trace   # 매퍼 패키지 지정 — SQL과 바인딩 파라미터가 찍힘
    org.flywaydb: debug

# ==================== dev ====================
---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:mysql://dev-db-host:3306/mydb?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  flyway:
    clean-disabled: true

logging:
  level:
    root: error
    com.imooyoni.board.data.mapper: "off"
