<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('게시판 목록 | Board Admin')}"></head>
<body>
<div class="app">

  <!-- ============ Header ============ -->
  <header th:replace="~{fragments/layout :: header('')}"></header>

  <div class="app-body">
    <!-- ============ Sidebar ============ -->

    <!-- ============ Main ============ -->
    <main class="app-main">
      <div class="page-head page-head--stacked">
        <nav class="breadcrumb"><span>홈</span><span>콘텐츠 관리</span><span>게시판 관리</span></nav>
        <h1 class="page-head__title">게시판 관리</h1>
      </div>

      <form class="page-form" method="get" th:action="@{/board}">
      <!-- ---------- 검색 섹션 ---------- -->
      <section class="panel search-panel">
        <div class="panel__body">
          <div class="search-panel__grid">
            <div class="field">
              <label class="field__label" for="q-title">제목</label>
              <input class="input" id="q-title" name="searchTitle" type="text" placeholder="제목을 입력하세요" th:value="${paging.searchTitle}">
            </div>
            <div class="field">
              <label class="field__label" for="q-author">작성자</label>
              <input class="input" id="q-author" name="searchWriter" type="text" placeholder="작성자를 입력하세요" th:value="${paging.searchWriter}">
            </div>
            <div class="field">
              <label class="field__label" for="q-date-from">등록일</label>
              <div class="date-range">
                <input class="input" id="q-date-from" name="startDate" type="date" th:value="${paging.startDate}">
                <span class="date-range__sep">~</span>
                <input class="input" id="q-date-to" name="endDate" type="date" th:value="${paging.endDate}">
              </div>
            </div>
          </div>
        </div>
        <div class="search-panel__footer">
          <a class="btn btn--secondary" id="btn-reset" th:href="@{/board}">초기화</a>
          <button type="submit" class="btn btn--primary" id="btn-search">
            <svg class="btn__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
            검색
          </button>
        </div>
      </section>

      <!-- ---------- 목록 테이블 (이 블록만 스크롤) ---------- -->
      <section class="table-block">
        <div class="table-toolbar">
          <span class="table-toolbar__count">전체 <strong th:text="${paging.allCount}">128</strong>건 · <span id="selected-count">0</span>건 선택</span>
          <div class="table-toolbar__spacer"></div>

          <select class="select select--sm" id="page-size" name="pageSize" aria-label="노출 개수" onchange="this.form.submit()">
            <option th:each="opt : ${ {5, 10, 20, 50, 100} }"
                    th:value="${opt}" th:text="|${opt}개씩|"
                    th:selected="${opt == paging.pageSize}">20개씩</option>
          </select>

          <span class="table-toolbar__divider"></span>

          <button type="button" class="btn btn--sm btn--danger-outline" id="btn-delete">
            <svg class="btn__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6.5h16"/><path d="M9.5 6.5V4.5h5v2"/><path d="M6.5 6.5 7.4 20h9.2l.9-13.5"/></svg>
            삭제
          </button>
          <a class="btn btn--sm btn--primary" id="btn-create" th:href="@{/board/form} + '?' + ${paging.getQueryString()}">
            <svg class="btn__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14"/><path d="M5 12h14"/></svg>
            등록
          </a>
        </div>

        <div class="table-scroll">
          <table class="data-table">
            <colgroup>
              <col style="width:44px"><col style="width:64px"><col>
              <col style="width:72px"><col style="width:120px"><col style="width:132px">
            </colgroup>
            <thead>
              <tr>
                <th class="col-check" scope="col">
                  <input type="checkbox" class="checkbox" id="check-all" aria-label="전체 선택">
                </th>
                <th class="col-no" scope="col">No</th>
                <th scope="col">제목</th>
                <th class="col-comment" scope="col">댓글</th>
                <th class="col-author" scope="col">작성자</th>
                <th class="col-date" scope="col">등록일</th>
              </tr>
            </thead>
            <tbody id="table-body">
              <tr th:if="${#lists.isEmpty(paging.body)}">
                <td class="cell-empty" colspan="6">게시글이 없습니다.</td>
              </tr>
              <tr th:each="board, stat : ${paging.body}">
                <td class="col-check">
                  <input type="checkbox" class="checkbox row-check" th:value="${board.id}"
                         th:attr="aria-label=|${board.id}번 글 선택|">
                </td>
                <td class="col-no" th:text="${paging.allCount - (paging.startRowNum + stat.index)}">128</td>
                <td>
                  <a class="cell-title" th:href="@{/board/{id}(id=${board.id})} + '?' + ${paging.getQueryString()}">
                    <span th:text="${board.title}">제목</span>
                  </a>
                </td>
                <td class="col-comment"><span class="cell-comment">0</span></td>
                <td class="col-author" th:text="${board.writer}">관리자</td>
                <td class="col-date" th:text="${#temporals.format(board.createdAt, 'yyyy-MM-dd')}">2026-08-28</td>
              </tr>
            </tbody>
          </table>
        </div>

        <!-- ---------- 페이징 ---------- -->
        <nav th:replace="~{fragments/paging :: paging(${paging})}"></nav>
      </section>
      </form>

    </main>
  </div>
</div>

<script th:src="@{/assets/js/alert.js}"></script>
<script th:src="@{/assets/js/board-api.js}"></script>
<script th:src="@{/assets/js/board-list.js}"></script>
</body>
</html>
